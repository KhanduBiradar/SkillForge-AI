<!DOCTYPE html>

    <title>Admin Panel | SkillForge AI</title>

    <link rel="stylesheet" href="css/admin.css">
</head>
<body>

<header class="admin-header">
    <h1>SkillForge AI - Admin Panel</h1>
</header>

<div class="dashboard">

    <div class="card">
        <h2 id="totalUsers">0</h2>
        <p>Total Users</p>

    <div class="card">
        <h2>6</h2>
        <p>Total Courses</p>

    <div class="card">
        <h2>95%</h2>

<table>

    <thead>
        <tr>
            <th>Name</th>
            <th>Email</th>
        </tr>
    </thead>

    <tbody id="userTable">

    </tbody>

<script src="js/admin.js"></script>
