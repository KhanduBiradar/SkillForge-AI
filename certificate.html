<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Certificate | SkillForge AI</title>

    <link rel="stylesheet" href="css/certificate.css">
</head>
<body>

<div class="certificate">

    <div class="logo">
        <h1>🏆 SkillForge AI</h1>
    </div>

    <h2>CERTIFICATE OF COMPLETION</h2>

    <p>This Certificate is Proudly Presented To</p>

    <h1 id="studentName"></h1>

    <p>For Successfully Completing</p>

    <h2 id="courseName">Python Programming</h2>

    <div class="details">

        <div>
            <h3>Date</h3>
            <p id="date"></p>
        </div>

        <div>
            <h3>Certificate ID</h3>
            <p id="certificateId"></p>
        </div>

    </div>

    <div class="signature">

        <div>
            <hr>
            <p>Instructor</p>
        </div>

        <div>
            <hr>
            <p>Director</p>
        </div>

    </div>

    <button onclick="window.print()">
        Download PDF
    </button>

</div>

<script src="js/certificate.js"></script>

</body>
</html>
