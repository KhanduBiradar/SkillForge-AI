<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard | SkillForge AI</title>

    <link rel="stylesheet" href="css/dashboard.css">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>

<div class="sidebar">

    <h2>SkillForge AI</h2>

    <a href="#">🏠 Dashboard</a>

        </div>

        <div class="card">

            <p>Completed</p>
        </div>

        <div class="card">
            <h2>75%</h2>
            <p>Progress</p>
        </div>

        <div class="card">
            <h2>5</h2>
            <p>Certificates</p>

    </div>

</div>

<script src="js/dashboard.js"></script>

</html>
